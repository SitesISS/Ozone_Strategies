  "id": "s1",
  "title": "Why countries must work together",
  "teach": "\n<p>The <b>ozone layer</b> in the stratosphere absorbs harmful <b>ultraviolet (UV) radiation</b> from the Sun. More UV reaching the ground means more skin cancer, cataracts and crop damage.</p>\n<p><b>Ozone-depleting substances (ODSs)</b>, such as <b>CFCs</b> from old fridges, air conditioners and aerosol sprays, drift up into the stratosphere. There they release <b>chlorine</b>, which breaks ozone down.</p>\n{{FIG:shield}}\n<p>Gases released in one country spread through the whole atmosphere, so <b>no country can fix the problem on its own</b>. Efforts to recover the ozone layer are an example of how <b>international cooperation</b> can have a positive impact: scientists now expect the ozone layer over most of the world to recover to 1980 levels by around <b>2040</b>, and over Antarctica by around <b>2066</b>.</p>",

   {
    "id": "c1",
    "q": "Why does ozone depletion need international agreements, not just action by individual countries?",
    "o": [
     "ODSs spread around the whole atmosphere",
     "Only a few countries have an ozone layer above them",
     "Each country's ozone layer can be repaired separately",
     "UV only affects the countries that release ODSs"
    ],
    "a": 0,
    "w": {
     "1": "The ozone layer surrounds the whole Earth. Every country has it above them.",
     "2": "The stratosphere is one connected layer. Gases mix around it, so it can't be repaired country by country.",
     "3": "UV damage happens wherever the ozone layer is thin, which is often far from where the ODSs were released (for example over Antarctica)."
    },
    "x": "ODSs mix through the whole atmosphere, so one country cutting its emissions isn't enough if others carry on. Every country has to act together.",
    "b": [
     {
      "q": "What does the ozone layer do?",
      "o": [
       "Absorbs harmful UV from the Sun",
       "Traps heat and warms the Earth's surface",
       "Produces most of the oxygen we breathe",
       "Stops acid rain from reaching the ground"
      ],
      "a": 0,
      "x": "Ozone absorbs harmful UV radiation. When it thins, more UV reaches the ground."
     },
     {
      "q": "Which element released from CFCs breaks down ozone?",
      "o": [
       "Chlorine",
       "Carbon",
       "Fluorine",
       "Hydrogen"
      ],
      "a": 0,
      "x": "CFC = chlorofluorocarbon. UV in the stratosphere breaks CFCs apart, releasing chlorine, which destroys ozone."

    ]
   }

 },
 {
  "id": "s2",
  "title": "The role of UNEP",
  "teach": "\n<p>The <b>United Nations Environment Programme (UNEP)</b> plays a critical role in protecting the stratospheric ozone layer. It does this in four main ways:</p>\n<div class=\"roles\">\n  <div class=\"tile\"><h4>Raising public awareness</h4><p>Helping people understand the problem and what they can do.</p></div>\n  <div class=\"tile\"><h4>Continued research</h4><p>Into the causes of ozone depletion and its impacts on health and the environment.</p></div>\n  <div class=\"tile\"><h4>Supporting governments and industries</h4><p>Helping them switch away from ODSs.</p></div>\n  <div class=\"tile\"><h4>Creating international agreements</h4><p>Such as the Montreal Protocol.</p></div>\n</div>",
  "checks": [
   {
    "id": "c2",
    "q": "UNEP funds scientists to measure ozone levels and to study rates of skin cancer. Which of UNEP's roles is this?",

    },
    "x": "Measuring ozone levels and studying health effects is research into the causes and impacts of ozone depletion.",
    "b": [
     {
      "q": "What does 'research' mean in UNEP's work?",

      "a": 0,
      "x": "Research means gathering evidence: measuring, monitoring and studying."

 {
  "id": "s3",
  "title": "The Montreal Protocol",
  "teach": "\n<p>The <b>Montreal Protocol on Substances that Deplete the Ozone Layer</b> was agreed in <b>1987</b> under the guidance of UNEP. It is a landmark international agreement.</p>\n<ul class=\"pts\">\n  <li>It has been <b>revised and strengthened</b> over time to reflect new scientific and technological advances. For example, the <b>1992 Copenhagen</b> meeting tightened the restrictions further.</li>\n  <li>A small group of countries signed it at first. Now <b>every country in the world</b> has ratified it: it was the first UN treaty to achieve this.</li>\n  <li>It is <b>legally binding</b>: countries must meet its targets.</li>\n  <li>As a result, emissions of ODSs have <b>fallen rapidly</b> since 1987.</li>\n</ul>\n{{FIG:timeline}}\n<p class=\"examtip\"><b>Examiner tip:</b> know the key reasons for the Protocol's success, such as international cooperation and legally binding targets, and how it has helped reverse ozone depletion.</p>",

 {
  "id": "s4",
  "title": "Phasing out ODSs fairly",
  "teach": "\n<p>The Montreal Protocol uses <b>phased reductions</b>: ODSs are cut step by step to a timetable, rather than banned overnight.</p>\n<ul class=\"pts\">\n  <li>Gradual reduction schedules have <b>allowed industries to adapt</b>.</li>\n  <li>They give time for <b>alternatives to ODSs to be developed and adopted</b>.</li>\n  <li><b>Developed countries</b> got earlier deadlines: they had phased out CFCs by 1996. <b>Developing countries</b> got a later deadline: 2010.</li>\n  <li>The replacements, <b>HCFCs</b>, are being phased out more slowly: by <b>2030</b> in developed countries, with UNEP aiming to end all HCFC production by <b>2040</b>.</li>\n</ul>\n<div class=\"tile\"><h4>The Multilateral Fund (MLF)</h4><p>Set up in <b>1991</b> to <b>help developing countries</b> meet and keep their Montreal Protocol commitments. It pays for industrial conversion (changing factories over to alternatives), technical assistance, training and <b>capacity building</b> for the future.</p></div>",

 {
  "id": "s5",
  "title": "Illegal trade and national governments",
  "teach": "\n<p>The <b>illegal market</b> for ozone-depleting substances is a significant challenge to ozone protection. Smugglers sell banned ODSs, sometimes labelled as something else.</p>\n<p>To curb the illegal trade and make sure countries comply with international rules, UNEP recommends:</p>\n<ul class=\"pts\"><li><b>persistent monitoring and enforcement</b></li><li><b>collaboration</b> with national authorities, <b>customs agencies</b> and other relevant stakeholders</li></ul>\n<p><b>National governments</b> play a crucial role in putting the agreements made under UNEP into practice, and in helping the switch to <b>ozone-friendly alternatives</b>. They have passed <b>national regulations</b> to reduce the use and production of ODSs such as CFCs.</p>\n<div class=\"tile\"><h4>Example: the USA</h4><p>As part of its commitment to the Montreal Protocol, the US Congress added <b>Title VI</b> to the <b>Clean Air Act</b>, making the <b>Environmental Protection Agency (EPA)</b> responsible for protecting the ozone layer.</p></div>",

 {
  "id": "s6",
  "title": "Replacing CFCs: HCFCs, HFCs and F-gases",
  "teach": "\n<p>CFCs had to be replaced with other chemicals for fridges, air conditioning, insulation and sprays. But some replacements bring problems of their own.</p>\n{{FIG:gases}}\n<ul class=\"pts\">\n  <li><b>HCFCs</b> (hydrochlorofluorocarbons) still <b>contain chlorine</b>, so they can still deplete the ozone layer, though less than CFCs. That's why they are being phased out too.</li>\n  <li><b>HFCs</b> (hydrofluorocarbons) contain hydrogen, fluorine and carbon but <b>no chlorine</b>. They were introduced as replacements because they <b>don't deplete ozone</b>.</li>\n  <li>But HFCs are <b>potent greenhouse gases</b> with a <b>high global warming potential (GWP)</b>: they trap heat in the atmosphere and contribute to climate change.</li>\n  <li><b>F-gases</b> (fluorinated gases, including HFCs and PFCs) are used in refrigeration, air conditioning and insulation. Many have a high GWP.</li>\n  <li>The <b>Kigali Amendment (2016)</b> to the Montreal Protocol is <b>phasing down</b> HFCs by more than 80% over the next few decades. This could avoid up to about 0.5 °C of global warming by 2100.</li>\n</ul>\n<p class=\"examtip\"><b>Examiner tip:</b> HCFCs contain <b>chlorine</b>, so they can deplete ozone. HFCs do <b>not</b> contain chlorine and do not harm the ozone layer, but they are still potent greenhouse gases.</p>",

 {
  "id": "s8",
  "title": "Local action",
  "teach": "\n<p>Individuals can help too. To reduce ozone depletion, people can:</p>\n<div class=\"roles\">\n  <div class=\"tile\"><h4>Avoid ODSs</h4><p>Avoid products that contain CFCs, HCFCs or nitrous oxide. Use \"ozone-friendly\" products and <b>pump-action</b> cleaning products and sprays, although these are more expensive and less efficient.</p></div>\n  <div class=\"tile\"><h4>Use less transport</h4><p>Walk, cycle or car-share; use public transport; choose electric vehicles.</p></div>\n  <div class=\"tile\"><h4>Use energy efficiently</h4><p>Use rechargeable equipment, electricity from clean sources and energy-saving products; service and maintain electrical goods.</p></div>\n  <div class=\"tile\"><h4>Service fridges and air conditioners</h4><p>Regular maintenance makes them last longer, work more efficiently, cost less to run, and helps <b>find and fix refrigerant leaks</b>.</p></div>\n</div>\n<p>Air conditioners are <b>energy-intensive</b> and widely used in homes, workplaces, vehicles and public buildings. Traditional units used ODSs such as CFCs, so leaks from old units are still a risk.</p>",

 {
  "id": "s9",
  "title": "Putting it together",
  "teach": "\n<p>Strategies to manage ozone depletion work at three levels, and each depends on the others.</p>\n{{FIG:levels}}\n<p>In an exam, you may be asked to <b>evaluate</b> a strategy. That means giving its strengths <b>and</b> its limitations. For example, safe disposal facilities destroy CFCs (a strength), but some developing countries can't afford them (a limitation).</p>",

    "id": "c16",

/* ===== Walk-through engine ===== */
const KEY = "em0680-ozone-strategies-walkthrough-v1";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const LET = "ABCD";
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const CHECKS = SECTIONS.flatMap(s => s.checks);

let P = { sec: 0, res: {} };           // saved progress
try { const raw = localStorage.getItem(KEY); if (raw) P = Object.assign(P, JSON.parse(raw)); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} };

/* Balanced answer positions: each letter is correct equally often, never 3 times running. */
const bags = { main: [], back: [] }, hist = { main: [], back: [] };
function deal(name, n, allowed) {
  const bag = bags[name], h = hist[name];
  const ok = t => t < n && (!allowed || allowed.includes(t)) && !(h.length >= 2 && h[h.length - 1] === t && h[h.length - 2] === t);
  let k = -1;
  for (let tries = 0; tries < 3 && k < 0; tries++) { for (let j = bag.length - 1; j >= 0; j--) if (ok(bag[j])) { k = j; break; } if (k < 0) bag.unshift(...shuffle([0, 1, 2, 3])); }
  const t = k >= 0 ? bag.splice(k, 1)[0] : (allowed ? allowed[0] : 0); h.push(t); return t;
}
function orderFor(n, correct, t, fixed) {
  const idx = [...Array(n).keys()];
  if (fixed) { const desc = idx.slice().reverse(); if (n - 1 - correct === t) return desc; if (correct === t) return idx; return Math.random() < .5 ? idx : desc; }
  const rest = shuffle(idx.filter(i => i !== correct)); rest.splice(t, 0, correct); return rest;
}
function order(q, bag) { return orderFor(q.o.length, q.a, deal(bag, q.o.length, q.fixed ? [q.a, q.o.length - 1 - q.a] : null), q.fixed); }

/* Live state of the current check */
let R = null;
const sectionDone = i => SECTIONS[i].checks.every(c => P.res[c.id]);
const unlocked = () => { let i = 0; while (i < SECTIONS.length && sectionDone(i)) i++; return i; }; // first unfinished section

function renderChips() {
  const u = unlocked();
  $("#chips").innerHTML = SECTIONS.map((s, i) => `<button type="button" data-i="${i}" class="${sectionDone(i) ? "done" : ""}" ${P.sec === i ? 'aria-current="step"' : ""} ${i > u ? "disabled title=\"Finish the earlier sections first\"" : ""}><span class="n">${sectionDone(i) ? "✓" : i + 1}</span>${esc(s.title)}</button>`).join("")
    + `<button type="button" data-i="end" ${P.sec === "end" ? 'aria-current="step"' : ""} ${u < SECTIONS.length ? "disabled" : ""}><span class="n">★</span>Summary</button>`;
  $("#chips").querySelectorAll("button").forEach(b => b.addEventListener("click", () => goSection(b.dataset.i === "end" ? "end" : +b.dataset.i)));
  const cur = $("#chips").querySelector('[aria-current="step"]'); if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: "nearest", inline: "nearest" });
}

function goSection(i) { P.sec = i; save(); R = null; render(); window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" }); }

function fillFigs(html) { return html.replace(/\{\{FIG:(\w+)\}\}/g, (m, k) => F[k] ? F[k]() : ""); }

function render() {
  renderChips();
  if (P.sec === "end") return renderEnd();
  if (P.sec > unlocked()) P.sec = unlocked();
  const s = SECTIONS[P.sec];
  const done = s.checks.filter(c => P.res[c.id]);
  const next = s.checks.find(c => !P.res[c.id]);
  $("#main").innerHTML = `
    <section class="card"><div class="eyebrow">Section ${P.sec + 1} of ${SECTIONS.length}</div><h2>${esc(s.title)}</h2><div class="notes">${fillFigs(s.teach)}</div></section>
    <section class="card check" id="checkcard">
      ${done.length ? `<div class="passed">${done.map(c => `<div><span class="tag ${P.res[c.id]}">${P.res[c.id] === "first" ? "First try" : P.res[c.id] === "help" ? "After help" : "Revisit"}</span><span>${esc(c.q)}</span></div>`).join("")}</div>` : ""}
      <div id="qzone"></div>
    </section>`;
  wireFig();
  if (next) startCheck(next);
  else finishSection();
}

function wireFig() {
  const fig = $("#inhib-fig"); if (!fig) return;
  const show = { normal: true, comp: false, nonc: false };
  const apply = () => { fig.querySelectorAll("[data-curve]").forEach(g => g.classList.toggle("off", !show[g.dataset.curve])); fig.querySelectorAll(".tog").forEach(b => { b.classList.toggle("on", show[b.dataset.show]); b.setAttribute("aria-pressed", show[b.dataset.show]); }); };
  fig.querySelectorAll(".tog[data-show]").forEach(b => b.addEventListener("click", () => { if (b.dataset.show !== "normal") { show[b.dataset.show] = !show[b.dataset.show]; apply(); } }));
  apply();
}

function startCheck(c) {
  R = { c, phase: "main", bi: 0, first: null, order: order(c, "main"), bOrder: null };
  drawQ(); clearLog();
}

function curQ() { return R.phase === "back" ? R.c.b[R.bi] : R.c; }
function curOrder() { return R.phase === "back" ? R.bOrder : R.order; }

function drawQ() {
  const c = R.c, s = SECTIONS[P.sec], q = curQ(), ord = curOrder();
  const idx = s.checks.indexOf(c) + 1;
  let label, cls = "";
  if (R.phase === "main") label = `Check ${idx} of ${s.checks.length}`;
  else if (R.phase === "back") { label = `Back-up question ${R.bi + 1} of ${c.b.length}`; cls = "backup"; }
  else { label = `Second try · Check ${idx}`; cls = "retry"; }
  const trail = R.phase === "main" ? "" : `<div class="trail"><b class="done">Check</b>${c.b.map((_, k) => `<i>→</i><b class="${R.phase === "back" && R.bi === k ? "on" : (R.phase === "retry" || R.bi > k ? "done" : "")}">Back-up ${k + 1}</b>`).join("")}<i>→</i><b class="${R.phase === "retry" ? "on" : ""}">Second try</b></div>`;
  $("#qzone").innerHTML = `
    <div class="qhead"><span class="stage ${cls}">${label}</span></div>${trail}
    ${q.fig ? F[q.fig]() : ""}
    <p class="stem">${esc(q.q)}</p>
    <div class="opts" id="opts">${ord.map((oi, pos) => `<button type="button" class="opt" data-oi="${oi}" id="opt-${pos}"><span class="k">${LET[pos]}</span><span>${esc(q.o[oi])}</span><span class="mark"></span></button>`).join("")}</div>
    <div class="log" id="log" aria-live="polite"></div>
    <div class="actions" id="actions"></div>`;
  $("#opts").querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => choose(+b.dataset.oi)));
}
function clearLog() { const l = $("#log"); if (l) l.innerHTML = ""; }
function letter(oi) { return LET[curOrder().indexOf(oi)]; }
function lock(chosen, correct, reveal) {
  $("#opts").querySelectorAll(".opt").forEach(b => {
    const oi = +b.dataset.oi; b.disabled = true;
    if (oi === chosen && chosen === correct) { b.classList.add("right"); b.querySelector(".mark").textContent = "Correct"; }
    else if (oi === chosen) { b.classList.add("wrong"); b.querySelector(".mark").textContent = "Your answer"; }
    else if (oi === correct && reveal) { b.classList.add("right"); b.querySelector(".mark").textContent = "Answer"; }
    else b.classList.add("dim");
  });
}
function msg(kind, title, text) {
  const d = document.createElement("div"); d.className = "msg " + kind;
  d.innerHTML = (title ? `<h3>${esc(title)}</h3>` : "") + `<p>${esc(text)}</p>`;
  $("#log").appendChild(d);
}
function actions(list) {
  const a = $("#actions"); a.innerHTML = "";
  list.forEach((it, k) => { const b = document.createElement("button"); b.type = "button"; b.className = "btn" + (it.ghost ? " ghost" : ""); b.textContent = it.label; b.addEventListener("click", it.go); a.appendChild(b); if (k === 0) setTimeout(() => { b.focus({ preventScroll: true }); b.scrollIntoView({ block: "nearest", behavior: reduceMotion ? "auto" : "smooth" }); }, 0); });
}

function choose(oi) {
  const c = R.c, q = curQ();
  if (R.phase === "back") {
    const ok = oi === q.a; lock(oi, q.a, true);
    msg(ok ? "good" : "bad", ok ? "Correct" : `The answer is ${letter(q.a)}`, q.x);
    const last = R.bi === c.b.length - 1;
    actions([{ label: last ? "Try the check question again" : "Next back-up question", go: () => {
      if (last) { R.phase = "retry"; const was = R.order.indexOf(c.a); if (c.fixed) { const f = R.order.slice().reverse(); if (f.indexOf(c.a) !== was) R.order = f; } else { const t = shuffle([0, 1, 2, 3].filter(p => p !== was))[0]; R.order = orderFor(4, c.a, t, false); } drawQ(); msg("hint", "Second try", "The options are in a new order, so read them carefully."); }
      else { R.bi++; R.bOrder = order(c.b[R.bi], "back"); drawQ(); }
      focusFirst();
    } }]);
    return;
  }
  const ok = oi === c.a;
  if (R.phase === "main") {
    if (ok) { lock(oi, c.a, false); msg("good", "Correct", c.x); record("first"); }
    else {
      lock(oi, c.a, false); R.first = oi;
      msg("bad", `Not quite: ${letter(oi)} isn't right`, c.w[oi] || "That isn't the right answer.");
      msg("hint", "Let's check the basics", `Answer ${c.b.length} short back-up questions, then try this one again. Re-read the notes above if you need to.`);
      actions([{ label: "Start the back-up questions", go: () => { R.phase = "back"; R.bi = 0; R.bOrder = order(c.b[0], "back"); drawQ(); focusFirst(); } }]);
    }
    return;
  }
  lock(oi, c.a, true);
  if (ok) { msg("good", "Got it on the second try", c.x); record("help"); }
  else { msg("bad", `Not this time. The answer is ${letter(c.a)}`, (c.w[oi] ? c.w[oi] + " " : "") + c.x); record("miss"); }
}
function focusFirst() { const b = $("#opt-0"); if (b) { b.focus({ preventScroll: true }); $("#qzone").scrollIntoView({ block: "start", behavior: reduceMotion ? "auto" : "smooth" }); } }

function record(result) {
  P.res[R.c.id] = result; save(); renderChips();
  const s = SECTIONS[P.sec], next = s.checks.find(c => !P.res[c.id]);
  if (next) actions([{ label: "Next check question", go: () => { render(); setTimeout(() => $("#checkcard").scrollIntoView({ block: "start", behavior: reduceMotion ? "auto" : "smooth" }), 0); } }]);
  else actions(sectionNav());
}
function sectionNav() {
  const last = P.sec === SECTIONS.length - 1;
  return [{ label: last ? "See your summary" : `Next section: ${SECTIONS[P.sec + 1].title}`, go: () => goSection(last ? "end" : P.sec + 1) }];
}
function finishSection() {
  const s = SECTIONS[P.sec];
  $("#qzone").innerHTML = `<p>You've finished this section's checks.</p><div class="actions" id="actions"></div>`;
  const a = sectionNav().concat([{ label: "Redo this section's questions", ghost: true, go: () => { s.checks.forEach(c => delete P.res[c.id]); save(); render(); } }]);
  const box = $("#actions");
  a.forEach(it => { const b = document.createElement("button"); b.type = "button"; b.className = "btn" + (it.ghost ? " ghost" : ""); b.textContent = it.label; b.addEventListener("click", it.go); box.appendChild(b); });
}

function renderEnd() {
  const n = CHECKS.length, c = { first: 0, help: 0, miss: 0 };
  CHECKS.forEach(k => { if (P.res[k.id]) c[P.res[k.id]]++; });
  const pts = c.first + c.help * 0.5;
  const fmt = v => (v % 1 ? Math.floor(v) + "½" : String(v));
  $("#main").innerHTML = `
    <section class="card"><div class="eyebrow">Summary</div>
      <div class="big">${fmt(pts)}<small> / ${n} checks</small></div>
      <p>${c.first} right first time · ${c.help} right after the back-up questions · ${c.miss} to revisit</p>
      <div class="secs">${SECTIONS.map((s, i) => { const r = s.checks.map(k => P.res[k.id]); const worst = r.includes("miss") ? "miss" : r.includes("help") ? "help" : "first";
        return `<div class="row"><span><span class="tag ${worst}">${worst === "first" ? "Secure" : worst === "help" ? "Getting there" : "Revisit"}</span> ${esc(s.title)}</span><button type="button" class="linkbtn" data-go="${i}">Go to section</button></div>`; }).join("")}</div>
    </section>
    <section class="card"><h2>Key points</h2><ol class="keys">${SUMMARY.map(t => `<li>${esc(t)}</li>`).join("")}</ol>
      <div class="actions"><button type="button" class="btn ghost" id="restart">Start again from the beginning</button><span id="confirm" class="note"></span></div></section>`;
  $("#main").querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => goSection(+b.dataset.go)));
  let armed = false;
  $("#restart").addEventListener("click", () => {
    if (!armed) { armed = true; $("#confirm").textContent = "This clears your answers. Click again to confirm."; setTimeout(() => { armed = false; const el = $("#confirm"); if (el) el.textContent = ""; }, 5000); return; }
    P = { sec: 0, res: {} }; save(); goSection(0);
  });
}
